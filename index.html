<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل برامج التوجيه الطلابي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b7a78;
            --secondary-color: #3aafa9;
            --dark-color: #17252a;
            --light-color: #feffff;
            --bg-color: #f4f7f6;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            border-bottom: 4px solid var(--primary-color);
        }

        .header-title h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .header-title p {
            font-size: 0.95rem;
            color: #666;
        }

        .logo img {
            height: 75px;
            object-fit: contain;
        }

        .add-form-container {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 25px;
        }

        .add-form-container h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--secondary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #205c5a;
        }

        .btn-danger {
            background-color: #e74c3c;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 5px solid var(--secondary-color);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .card-header h3 {
            font-size: 1.15rem;
            color: var(--dark-color);
        }

        .badge {
            background: #e8f4f8;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .card-body p {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 10px;
            font-size: 0.8rem;
            color: #888;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column-reverse;
                text-align: center;
                gap: 15px;
            }
            .logo img {
                height: 60px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">
            <h1>منظومة التوجيه الطلابي</h1>
            <p>دليل البرامج والإرشاد الإثرائي والنفسي والوقائي</p>
        </div>
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Ministry_of_Education_KSA_Logo.svg" alt="شعار وزارة التعليم">
        </div>
    </header>

    <div class="add-form-container">
        <h3>إضافة برنامج جديد</h3>
        <form id="programForm">
            <div class="form-grid">
                <input type="text" id="title" placeholder="اسم البرنامج" required>
                <select id="category" required>
                    <option value="">اختر المجال</option>
                    <option value="وقائي">وقائي</option>
                    <option value="إنشائي / إثرائي">إنشائي / إثرائي</option>
                    <option value="علاجي">علاجي</option>
                    <option value="تحصيلي">تحصيلي / دراسي</option>
                    <option value="مهني">مهني / مستقبلي</option>
                </select>
                <input type="text" id="target" placeholder="الفئة المستهدفة (مثال: الطلاب، اولياء الأمور)" required>
            </div>
            <textarea id="description" rows="2" placeholder="وصف مختصر للبرنامج وأهدافه..." required></textarea>
            <button type="submit" class="btn" style="margin-top: 10px;">إضافة البرنامج +</button>
        </form>
    </div>

    <div class="programs-grid" id="programsContainer">
        <!-- يتم تحميل البرامج هنا تلقائياً -->
    </div>
</div>

<script>
    // قائمة البرامج المعتمدة الافتراضية
    const defaultPrograms = [
        { id: 1, title: "رفق (الرفق بالطلاب)", category: "وقائي", target: "جميع الطلاب", desc: "برنامج وقائي وتوعوي يهدف للحد من العنف بجميع أشكاله ونشر ثقافة التسامح والرفق في البيئة المدرسية." },
        { id: 2, title: "خط المساندة", category: "وقائي", target: "الطلاب وأولياء الأمور", desc: "التوعية بخط مساندة الطفل (116111) وتقديم الدعم النفسي والاجتماعي للطلاب عند الحاجة." },
        { id: 3, title: "خافض (الحد من التنمر)", category: "وقائي", target: "جميع المراحل", desc: "برنامج يسعى للحد من ظاهرة التنمر بين الطلاب وتقديم آليات المواجهة والتدخل المبكر." },
        { id: 4, title: "التوجيه المهني والتعليمي (مساري)", category: "مهني", target: "طلاب المرحلة المتوسطة والثانوية", desc: "مساعدة الطلاب على اكتشاف ميولهم وقدراتهم واختيار المسارات التعليمية والمهنية المناسبة." },
        { id: 5, title: "تعزيز السلوك الإيجابي", category: "إنشائي / إثرائي", target: "جميع الطلاب", desc: "مشروع يهدف إلى تنمية السلوكيات السليمة وتكريم الطلاب المتميزين سلوكياً في المدرسة." },
        { id: 6, title: "رعاية الطلاب المتفوقين والوهوبين", category: "إنشائي / إثرائي", target: "الطلاب المتفوقون", desc: "تقديم برامج إثرائية ورعاية خاصة للطلاب المتميزين دراسياً وتنمية قدراتهم الابداعية." },
        { id: 7, title: "رعاية الطلاب متاخري التحصيل الدراسي", category: "تحصيلي", target: "الطلاب المتأخرون دراسياً", desc: "حصر ومتابعة الطلاب ضعاف التحصيل ووضع خطط علاجية وتوجيهية لرفع مستواهم الدراسي." },
        { id: 8, title: "حماية (التوعية بأضرار المخدرات)", category: "وقائي", target: "المرحلة المتوسطة والثانوية", desc: "حماية الطلاب من مخاطر المؤثرات العقلية والمخدرات والتوعية بآثارها وتنمية مهارات الرفض." },
        { id: 9, title: "تكافل (المساعدات المالية والعينية)", category: "علاجي", target: "الطلاب المحتاجون", desc: "تقديم الدعم المادي والمعنوي للطلاب المحتاجين لضمان استمرارهم وتحصيلهم الدراسي دون عوائق." },
        { id: 10, title: "التهيئة والإرشاد النفسي للاختبارات", category: "تحصيلي", target: "جميع الطلاب", desc: "تخفيف قلق الاختبارات وتدريب الطلاب على مهارات الاستذكار الجيد وإدارة الوقت." }
    ];

    // استرجاع البرامج من LocalStorage أو تحميل القائمة الافتراضية
    function getPrograms() {
        const stored = localStorage.getItem('school_programs');
        if (!stored) {
            localStorage.setItem('school_programs', JSON.stringify(defaultPrograms));
            return defaultPrograms;
        }
        return JSON.parse(stored);
    }

    // عرض البرامج في الصفحة
    function renderPrograms() {
        const programs = getPrograms();
        const container = document.getElementById('programsContainer');
        container.innerHTML = '';

        programs.forEach(program => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <h3>${program.title}</h3>
                        <span class="badge">${program.category}</span>
                    </div>
                    <div class="card-body">
                        <p>${program.desc}</p>
                    </div>
                </div>
                <div class="card-footer">
                    <span>Target: ${program.target}</span>
                    <button class="btn btn-danger" onclick="deleteProgram(${program.id})">حذف</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // إضافة برنامج جديد
    document.getElementById('programForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const newProgram = {
            id: Date.now(),
            title: document.getElementById('title').value,
            category: document.getElementById('category').value,
            target: document.getElementById('target').value,
            desc: document.getElementById('description').value
        };

        const programs = getPrograms();
        programs.unshift(newProgram);
        localStorage.setItem('school_programs', JSON.stringify(programs));
        
        renderPrograms();
        this.reset();
    });

    // حذف برنامج
    function deleteProgram(id) {
        if(confirm('هل أنت تأكد من رغبتك في حذف هذا البرنامج؟')) {
            let programs = getPrograms();
            programs = programs.filter(p => p.id !== id);
            localStorage.setItem('school_programs', JSON.stringify(programs));
            renderPrograms();
        }
    }

    // تشغيل العرض أول مرة
    renderPrograms();
</script>

</body>
</html>
